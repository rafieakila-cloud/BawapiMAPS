<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BawapiMAPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Inter,Arial,sans-serif;background:#0d0f14;color:#ececec;height:100vh;display:flex}
#side{width:300px;flex-shrink:0;background:#12151c;border-right:1px solid rgba(255,255,255,.08);padding:18px 14px;display:flex;flex-direction:column;gap:10px;z-index:500}
.brand{display:flex;align-items:center;gap:10px}
.pin{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#E8821E,#D96570);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
.brand b{font-size:17px}.brand small{display:block;font-size:11px;color:#9AA0AE;font-weight:400}
#q{background:#171A21;border:1px solid rgba(255,255,255,.12);color:#ececec;border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
#q:focus{outline:none;border-color:#E8821E}
#layers{display:flex;gap:6px}
#layers button{flex:1;background:#171A21;color:#ececec;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:8px;cursor:pointer;font-size:12px}
#layers button.on{border-color:#E8821E;background:#221a10}
#res{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.r{background:#171A21;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:13px}
.r:hover{border-color:#E8821E}
.r small{color:#9AA0AE;display:block;font-size:11px}
#me{margin-top:auto;background:#171A21;border:1px solid rgba(255,255,255,.12);color:#ececec;border-radius:10px;padding:10px;cursor:pointer}
#map{flex:1;min-width:0}
.leaflet-container{font-family:inherit}
@media(max-width:700px){#side{position:absolute;inset:auto 0 0 0;width:100%;max-height:44%;border-right:none;border-top:1px solid rgba(255,255,255,.1)}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><span class="pin">⌖</span><div><b>BawapiMAPS</b><small>Leaflet • OSM • gratis</small></div></div>
  <input id="q" placeholder="Cari tempat… Enter">
  <div id="layers"><button data-l="osm" class="on">Jalan</button><button data-l="sat">Satelit</button><button data-l="dark">Gelap</button></div>
  <div id="res"></div>
  <button id="me">Lokasi saya</button>
</aside>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false}).setView([-8.219,114.369],12);
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({position:'bottomright'}).addTo(map);
const layers={
  osm:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),
  sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri'}),
  dark:L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OSM © CARTO'})
};
layers.osm.addTo(map);
document.querySelectorAll('#layers button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#layers button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  Object.values(layers).forEach(l=>map.removeLayer(l));layers[b.dataset.l].addTo(map);
});
const icon=L.divIcon({html:'<div style="background:linear-gradient(135deg,#E8821E,#D96570);width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.4)"></div>',iconSize:[30,30],iconAnchor:[15,28]});
L.marker([-8.322,114.287],{icon}).addTo(map).bindPopup('<b>MTsN 10 Banyuwangi</b><br>Rogojampi').openPopup();
let marks=[];
document.getElementById('q').addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;
  const box=document.getElementById('res');box.innerHTML='<div class="r">Mencari…</div>';
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(e.target.value),{headers:{'Accept':'application/json'}}).then(r=>r.json()).catch(()=>[]);
  box.innerHTML=r.length?'':'<div class="r">Tidak ketemu.</div>';
  marks.forEach(m=>map.removeLayer(m));marks=[];
  r.forEach(p=>{
    const d=document.createElement('div');d.className='r';d.innerHTML='<b>'+p.display_name.split(',')[0]+'</b><small>'+p.display_name.slice(0,80)+'</small>';
    d.onclick=()=>{const m=L.marker([+p.lat,+p.lon],{icon}).addTo(map).bindPopup(p.display_name).openPopup();marks.push(m);map.setView([+p.lat,+p.lon],15);};
    box.appendChild(d);
  });
});
document.getElementById('me').onclick=()=>map.locate({setView:true,maxZoom:15});
map.on('locationfound',e=>L.circle(e.latlng,{radius:e.accuracy/2,color:'#E8821E'}).addTo(map));
map.on('locationerror',()=>alert('Izin lokasi ditolak / tidak tersedia (butuh https).'));
</script>
</body>
</html>
